      <stop offset="0" stop-color="#06172d"/>
      <stop offset="0.48" stop-color="#0a2944"/>
      <stop offset="1" stop-color="#08766f"/>
    </linearGradient>
    <linearGradient id="edge" x1="72" y1="76" x2="445" y2="446" gradientUnits="userSpaceOnUse">
