name: Firebase v68 credential probe

on:
  push:
    branches:
      - hardening/system-wide-v68-20260830
    paths:
      - .github/workflows/firebase-v68-credential-probe.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      FIREBASE_SERVICE_ACCOUNT_PROJECT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_DIVERSEY_SOLICITACOES_PWA }}
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      GOOGLE_APPLICATION_CREDENTIALS_JSON: ${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}
      GOOGLE_SERVICE_ACCOUNT: ${{ secrets.GOOGLE_SERVICE_ACCOUNT }}
    steps:
      - name: Check deploy credential availability without exposing values
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for name in \
            FIREBASE_TOKEN \
            FIREBASE_SERVICE_ACCOUNT \
            FIREBASE_SERVICE_ACCOUNT_PROJECT \
            GCP_SA_KEY \
            GOOGLE_CREDENTIALS \
            GOOGLE_APPLICATION_CREDENTIALS_JSON \
            GOOGLE_SERVICE_ACCOUNT
          do
            if [ -n "${!name:-}" ]; then
              echo "${name}=SET"
              found=1
            else
              echo "${name}=UNSET"
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "No supported Firebase/GCP deploy credential is available to this workflow."
            exit 12
          fi
