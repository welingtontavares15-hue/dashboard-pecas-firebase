name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test -- --runInBand

      - name: Privacy guard
        run: node scripts/redact-technician-fallback.mjs --check

      - name: Validate security runtime
        shell: bash
        run: |
          set -euo pipefail
          test -f js/secure-auth-bridge.js
          test -f js/security-hardening-runtime.js
          test -f firebase/database.rules.v68.json
          test -f functions/index.js
          node --check functions/index.js
          node --check functions/lib/auth-core.js
          node --check js/security-hardening-runtime.js

      - name: Lint
        run: npm run lint:check

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage runtime-only site
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp index.html offline.html clear-cache.html manifest.webmanifest firebase-healthcheck.html service-worker.js dist/
          cp -R css js icons health templates dist/

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
