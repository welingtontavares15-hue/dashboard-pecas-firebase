name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test -- --runInBand

      - name: Device biometric encryption in Chrome
        run: npm run test:device-biometric

      - name: Layout overflow in Chrome (390/768/1280/1440 px)
        run: npm run test:layout

      - name: Python syntax
        run: python -m compileall -q scripts

      - name: Python tests
        run: npm run test:python

      - name: Critical JavaScript lint
        run: npm run lint:critical

      - name: Privacy guard
        run: node scripts/redact-technician-fallback.mjs --check

      - name: Legacy style lint report
        continue-on-error: true
        run: npm run lint:check

      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=high

  deploy:
    needs: quality
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build optimized runtime site
        run: node scripts/build-site.mjs

      - name: Verify production bundles
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/css/wwm-core.bundle.css
          test -s dist/css/wwm-theme.bundle.css
          grep -q 'data-wwm-styles-bundled="true"' dist/index.html
          grep -q 'wwm-core.bundle.css' dist/service-worker.js
          grep -q 'wwm-theme.bundle.css' dist/service-worker.js

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
