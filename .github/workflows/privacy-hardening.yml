name: Privacy hardening

on:
  push:
    branches:
      - gpt72/executive-hardening-20260827
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: gpt72/executive-hardening-20260827

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Sanitize public technician fallback
        run: node scripts/redact-technician-fallback.mjs --apply

      - name: Commit remediation when needed
        shell: bash
        run: |
          if git diff --quiet -- js/data.js; then
            echo "No privacy remediation changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/data.js
          git commit -m "security: remove residential data from public fallback"
          git push origin HEAD:gpt72/executive-hardening-20260827
