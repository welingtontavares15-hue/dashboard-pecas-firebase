name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Functions dependencies
        run: npm install --prefix functions --ignore-scripts --no-fund

      - name: Test
        run: npm test -- --runInBand

      - name: Privacy guard
        run: node scripts/redact-technician-fallback.mjs --check

      - name: Validate runtime artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f service-worker.js
          test -f manifest.webmanifest
          test -d css
          test -d js
          test -d icons
          test -f js/secure-auth-bridge.js
          test -f js/security-hardening-runtime.js
          test -f firebase/database.rules.v68.json
          test -f functions/index.js
          node --check functions/index.js
          node --check functions/lib/auth-core.js
          node --check js/security-hardening-runtime.js
          node --check js/workflow-policy.js
          node -e "require('./functions/node_modules/firebase-admin/app'); require('./functions/node_modules/firebase-functions/v2/https')"

      - name: Critical lint
        run: npm run lint:critical

      - name: Legacy lint non-regression
        run: npm run lint:baseline

      - name: Static-site production dependency audit
        run: npm run audit:production

      - name: Functions production dependency audit
        run: npm audit --prefix functions --omit=dev --audit-level=high
