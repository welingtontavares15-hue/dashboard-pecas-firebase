name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - gpt72/full-system-hardening-20260903

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      - name: JavaScript tests
        run: npm test -- --runInBand

      - name: Python syntax
        run: python -m compileall -q scripts

      - name: Python tests
        run: npm run test:python

      - name: Critical JavaScript lint
        run: npm run lint:critical

      - name: Privacy guard
        run: node scripts/redact-technician-fallback.mjs --check

      - name: Validate runtime artifact inputs
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f service-worker.js
          test -f manifest.webmanifest
          test -d css
          test -d js
          test -d icons

      - name: Legacy style lint report
        continue-on-error: true
        run: npm run lint:check

      - name: Dependency audit report
        continue-on-error: true
        run: npm audit --audit-level=high

  passkey-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check passkey backend syntax
        run: node --check functions/index.js && node --check functions/passkey-utils.js && node --check js/passkeys.js
      - name: Test passkey helpers
        run: node --test functions/test/*.test.js
      - name: Verify staged Firebase rules
        run: node scripts/check-passkey-rules.mjs

  passkey-database-emulator:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java for Realtime Database emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install passkey and rules-testing dependencies
        run: npm install --prefix functions --no-package-lock --no-audit --no-fund
      - name: Run RTDB authorization integration tests
        run: npx --yes firebase-tools@14 emulators:exec --only database --project demo-wwm-rules --config firebase.passkeys.emulator.json "node --test functions/integration/rtdb-rules.test.js"
